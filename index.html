<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-store"><title>Штаб</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>body{margin:0;background:#0a1322;color:#6ee87d;font:16px ui-monospace,Menlo,monospace;display:flex;align-items:center;justify-content:center;height:100vh}</style>
</head><body><div id="boot">&gt;штаб_ загружаю…</div>
<script>
// Telegram caches this page hard; the app itself is fetched fresh every time.
try{Telegram.WebApp.ready();Telegram.WebApp.expand();}catch(e){}
fetch("app.html?ts="+Date.now(),{cache:"no-store"}).then(r=>r.text()).then(html=>{
  document.open();document.write(html);document.close();
}).catch(()=>{document.getElementById("boot").textContent="Не смог загрузить приложение — проверь интернет и открой заново.";});
</script></body></html>
